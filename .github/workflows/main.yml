name: Compile Pack to Repository

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'pack.zip'

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Pack Zip
        run: |
          rm -f pack.zip
          zip -r pack.zip assets pack.mcmeta pack.png
          
      - name: Generate SHA-1 Hash
        run: |
          SHA=$(sha1sum pack.zip | awk '{print $1}')
          echo "============================================="
          echo " YOUR NEW SHA-1 HASH IS: $SHA"
          echo "============================================="

      - name: Commit Zip Directly to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pack.zip
          git commit -m "Automated pack.zip rebuild [skip ci]" || echo "No changes to commit"
          git push origin main
