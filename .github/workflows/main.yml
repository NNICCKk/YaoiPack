name: Deploy Resource Pack

on:
  push:
    branches:
      - main

# Permissions needed to host static files on GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Pack Zip
        run: zip -r pack.zip assets/ pack.mcmeta pack.png

      - name: Generate SHA-1 Hash
        run: |
          SHA=$(sha1sum pack.zip | awk '{print $1}')
          echo "============================================="
          echo " YOUR NEW SHA-1 HASH IS: $SHA"
          echo "============================================="

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
