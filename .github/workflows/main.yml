name: Deploy Resource Pack

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Create a clean folder specifically for the web host
      - name: Setup Web Folder
        run: mkdir public

      # 2. Zip your files directly into that web folder
      - name: Create Pack Zip
        run: zip -r public/pack.zip assets/ pack.mcmeta pack.png

      # 3. Add supporting files to the web folder so GitHub doesn't ignore things
      - name: Add Static Web Files
        run: |
          touch public/.nojekyll
          cp pack.png public/pack.png 2>/dev/null || true

      - name: Generate SHA-1 Hash
        run: |
          SHA=$(sha1sum public/pack.zip | awk '{print $1}')
          echo "============================================="
          echo " YOUR NEW SHA-1 HASH IS: $SHA"
          echo "============================================="

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 4. Target ONLY the public folder to guarantee the zip transfers
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
