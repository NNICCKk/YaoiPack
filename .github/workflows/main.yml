name: Deploy Resource Pack

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Web Target
        run: |
          mkdir -p public
          touch public/.nojekyll
          
          # Force copy your pack.png if it exists anywhere
          find . -name "pack.png" -not -path "./public/*" -exec cp {} public/pack.png \; 2>/dev/null || true
          
          # Look for pack.mcmeta to find your true Minecraft root folder
          MCMETA_PATH=$(find . -name "pack.mcmeta" -not -path "./public/*" | head -n 1)
          
          if [ -z "$MCMETA_PATH" ]; then
            echo "ERROR: pack.mcmeta was not found anywhere in the repository!"
            exit 1
          fi
          
          # Move to the folder containing pack.mcmeta and compress everything cleanly
          TARGET_DIR=$(dirname "$MCMETA_PATH")
          echo "Found Minecraft assets inside directory: $TARGET_DIR"
          
          cd "$TARGET_DIR"
          zip -r "$GITHUB_WORKSPACE/public/pack.zip" assets pack.mcmeta pack.png 2>/dev/null || zip -r "$GITHUB_WORKSPACE/public/pack.zip" *
          
          cd "$GITHUB_WORKSPACE"
          echo '<html><head><title>Resource Pack Download</title></head><body style="font-family:sans-serif; text-align:center; padding-top:50px;"><h1>YaoiPack Online Host</h1><p><a href="./pack.zip" style="font-size:22px; color:#007bff; font-weight:bold; text-decoration:none;">👉 Click Here to Download pack.zip Directly 👈</a></p></body></html>' > public/index.html

       McKinley-Verify:
        run: ls -la public/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
